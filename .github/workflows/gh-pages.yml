name: gh-pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [ui-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-games
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Подтянуть свежий babrs-ui
        run: npm update babrs-ui
      - run: npm test
      - run: npm run build
      - name: Опубликовать сборку в ветку gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          touch build/.nojekyll
          cd build
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
